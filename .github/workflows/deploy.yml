name: CI/CD Pipeline for Weather_API


on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: nafizimtiaz/weather_api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate timestamp tag (yymmddhm)
        id: get_tag
        run: echo "TAG=$(date +'%y%m%d%H%M')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build --build-arg VERSION=$TAG -t $IMAGE_NAME:$TAG .

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push $IMAGE_NAME:$TAG

      - name: Set up kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl version --client
  
      - name: Deploy to Kubernetes
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl set image deployment/weather-api weather-api=$IMAGE_NAME:$TAG -n default
          kubectl rollout status deployment/weather-api -n default
